# Render blueprint for the REVEAL 2.0 API (apps/api).
# The web app (apps/web) deploys separately on Vercel (see vercel.json + DEPLOY.md).
#
# On every deploy: install deps, build @reveal/shared, generate the Prisma client
# and compile the API; then (preDeploy) run migrations + push the v2 schema + seed
# the master data against DATABASE_URL; then start the server.
services:
  - type: web
    name: reveal-api
    runtime: node
    plan: free
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @reveal/shared build &&
      pnpm --filter @reveal/api v2:generate &&
      pnpm --filter @reveal/api build
    preDeployCommand: pnpm --filter @reveal/api db:deploy
    startCommand: pnpm --filter @reveal/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon Postgres connection string (Render → Environment → add secret).
      - key: DATABASE_URL
        sync: false
      # A long random string; Render can generate one.
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel web URL(s), comma-separated (e.g. https://reveal.vercel.app).
      - key: CORS_ORIGIN
        sync: false
      # Public site URL, used in verification email copy/links.
      - key: APP_URL
        sync: false
      # Optional email transport (auth verification). Leave unset to log codes.
      - key: BREVO_API_KEY
        sync: false
