services:
  - type: web
    name: reveal-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @reveal/shared build && pnpm --filter @reveal/api build
    startCommand: pnpm --filter @reveal/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: reveal-db
    plan: free
    databaseName: reveal
