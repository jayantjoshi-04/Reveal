# REVEAL API — Render Blueprint (Infrastructure as Code).
# This repo's Render Blueprint is configured to read this file at infra/render.yaml.
# In the dashboard: Blueprints → Reveal → Manual sync (it reads this file).
#
# The database is an EXTERNAL managed Postgres (Neon free tier) — NOT a Render
# database — because Render's free Postgres expires after 30 days. Set its
# connection string as DATABASE_URL below (Render → Environment → add secret).
#
# On every deploy: install deps → build @reveal/shared → build the API
# (prisma generate + tsc); then (preDeploy) run the auth migrations, push the
# v2 Prisma schema, and seed the master data against DATABASE_URL; then start.
services:
  - type: web
    name: reveal-api
    runtime: node
    plan: free
    # corepack enable guarantees the pinned pnpm is on PATH on Render's builder.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reveal/shared build && pnpm --filter @reveal/api build
    # Free-tier note: Render runs preDeployCommand only on PAID instances, so on
    # the free plan we seed inside the start command — db:deploy runs first
    # (idempotent: auth migrations + v2 schema push + master-data seed), THEN the
    # server starts. The server only begins serving after the seed finishes.
    # Watch the log for "✅ v2 seed complete". On a paid plan, move db:deploy to a
    # preDeployCommand instead for faster cold starts.
    startCommand: pnpm --filter @reveal/api db:deploy && pnpm --filter @reveal/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Your Neon connection string — MUST include ?sslmode=require.
      # e.g. postgresql://USER:PASSWORD@ep-xxx.region.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Render generates a strong random secret — you don't invent one.
      - key: JWT_SECRET
        generateValue: true
      # Set this to your Vercel site URL AFTER the web deploy,
      # e.g. https://reveal.vercel.app  (comma-separated for multiple origins).
      - key: CORS_ORIGIN
        sync: false
      # 'manual' → deterministic report writer, no API key needed (zero-cost default).
      # Switch to 'auto' and add ANTHROPIC_API_KEY for live AI-written prose.
      - key: SYNTHESIS_MODE
        value: manual
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Email (verification + welcome) ──
      # Set APP_URL to your Vercel site so email links point at the live app.
      - key: APP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # Pick ONE transport. HTTP transports (Resend / Brevo) use HTTPS and work
      # even on hosts that block outbound SMTP ports — recommended on Render.
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # …or any SMTP provider (leave the HTTP keys blank if you use these):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
